<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <h1 id="auth-title">Welcome back</h1>
            <p id="auth-subtitle" class="subtitle">Sign in to your account</p>

            <!-- Tab switcher -->
            <div class="tab-row">
                <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
                <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form" autocomplete="off">
                <div class="field">
                    <label for="signin-username">Username</label>
                    <input type="text" id="signin-username" placeholder="your_username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div id="signin-error" class="form-error"></div>
                <button type="submit" class="btn-primary" id="signin-btn">
                    <span>Sign In</span>
                    <div class="btn-loader hidden"></div>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden" autocomplete="off">
                <div class="field">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Shivam" required>
                </div>
                <div class="field">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="your_username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min 4 characters" autocomplete="new-password" required>
                </div>
                <div id="signup-error" class="form-error"></div>
                <button type="submit" class="btn-primary" id="signup-btn">
                    <span>Create Account</span>
                    <div class="btn-loader hidden"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- App Screen -->
    <div id="app-screen" class="screen hidden">
        <div class="app-layout">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <div class="logo-sm">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    </div>
                    <span class="app-title">Todos</span>
                </div>
                <div class="header-right">
                    <span id="user-badge" class="user-badge"></span>
                    <button onclick="logout()" class="btn-ghost" id="logout-btn" title="Sign out">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sign out
                    </button>
                </div>
            </header>

            <!-- Main -->
            <main class="app-main">
                <!-- Add todo -->
                <div class="add-bar">
                    <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="200">
                    <button onclick="addTodo()" class="btn-add" id="add-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add
                    </button>
                </div>

                <!-- Filter tabs -->
                <div class="filter-row">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">All</button>
                    <button class="filter-btn" data-filter="active" onclick="setFilter(this)">Active</button>
                    <button class="filter-btn" data-filter="done" onclick="setFilter(this)">Done</button>
                </div>

                <!-- Stats -->
                <div class="stats-row">
                    <span id="stats-text" class="stats-text"></span>
                </div>

                <!-- Todo list -->
                <div id="todo-list" class="todo-list"></div>

                <!-- Empty state -->
                <div id="empty-state" class="empty-state hidden">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12h6"/></svg>
                    <p id="empty-text">No tasks yet. Add one above!</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-card" id="modal-card">
            <div class="modal-header">
                <h2>Edit task</h2>
                <button class="modal-close" onclick="closeEditModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label for="edit-input">Task title</label>
                    <input type="text" id="edit-input" placeholder="Task title" maxlength="200">
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeEditModal()" class="btn-secondary">Cancel</button>
                <button onclick="saveEdit()" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
